# GameAP Daemon configuration
#
# The daemon communicates with the GameAP panel over gRPC only. The
# easiest way to produce a working config is the enroll command:
#   gameap-daemon enroll --connect grpc://panel.example.com:31718/<setup-key>

# ------------------------------------------------------------------
# Node
# ------------------------------------------------------------------

# Dedicated server ID (required, must match the node ID in GameAP panel)
ds_id: 1

# API key issued by the panel (required, sent in the gRPC registration)
api_key: your-api-key-here

# ------------------------------------------------------------------
# gRPC connection to the panel
# ------------------------------------------------------------------

grpc:
  # Panel gRPC endpoint (host:port). If not set, the address is derived
  # from the deprecated api_host key (host:31718).
  address: localhost:31718

  # Disable TLS (plaintext connection). Also enabled when the deprecated
  # api_host starts with http://
  # insecure: false

  # heartbeat_interval: 30s
  # connect_timeout: 30s
  # initial_reconnect_delay: 1s
  # max_reconnect_delay: 60s

# Deprecated: kept only as a fallback source for the gRPC address and
# the insecure transport detection. Prefer grpc.address / grpc.insecure.
# api_host: http://localhost:2080

# ------------------------------------------------------------------
# TLS / Certificates (mTLS for the gRPC connection)
# Relative paths are resolved against the config file directory.
# The enroll command downloads these automatically.
# ------------------------------------------------------------------

# Certificates can be specified as file paths:
ca_certificate_file: ./certs/ca.crt
certificate_chain_file: ./certs/server.crt
private_key_file: ./certs/server.key

# Or as inline PEM values (takes precedence over file paths):
# ca_certificate: |
#   -----BEGIN CERTIFICATE-----
#   MIIDPTCCAiWgAwIBAgIRAIy/eAu45373SY5SxmS8HsowDQYJKoZIhvcNAQELBQAw
#   ...
#   -----END CERTIFICATE-----
# certificate_chain: |
#   -----BEGIN CERTIFICATE-----
#   MIIDPTCCAiWgAwIBAgIRAIy/eAu45373SY5SxmS8HsowDQYJKoZIhvcNAQELBQAw
#   ...
#   -----END CERTIFICATE-----
# private_key: |
#   -----BEGIN PRIVATE KEY-----
#   MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCaJGeZltblsjgD
#   ...
#   -----END PRIVATE KEY-----

# If your private key is encrypted, you can specify the password here:
# private_key_password: abracadabra

# ------------------------------------------------------------------
# Metrics filters
# Restrict which network interfaces and disks are reported by the
# metrics collector. Leave empty (or remove) to auto-select physical,
# non-loopback interfaces and the root "/" filesystem plus the
# work_path drive.
# ------------------------------------------------------------------

if_list:
  - eth0
  - eth1

drives_list:
  - /
  - /home/server

# ------------------------------------------------------------------
# Logging
# log_level is parsed by the first character: trace / debug / info /
# warning / error / fatal. Default: info.
# ------------------------------------------------------------------

# output_log: /var/log/gameap-daemon/output.log
# error_log: /var/log/gameap-daemon/error.log
log_level: debug

# ------------------------------------------------------------------
# Game server paths
# ------------------------------------------------------------------

# Base directory where game servers are installed.
# work_path: /srv/gameap

# Directory for additional tools (added to PATH). Defaults to {work_path}/tools.
# tools_path: /srv/gameap/tools

# Directory that contains steamcmd (steamcmd.sh / steamcmd.exe), used for
# game installations. The enroll command writes it automatically.
# steamcmd_path: /srv/gameap/steamcmd

# Windows-only paths:
# path_7zip: C:\gameap\tools\7zip\7za.exe
# path_starter: C:\gameap\daemon\gameap-starter.exe

# ------------------------------------------------------------------
# Steam credentials (optional; leave empty for anonymous SteamCMD)
# ------------------------------------------------------------------

# steam_config:
#   login: your-steam-user
#   password: your-steam-pass

# ------------------------------------------------------------------
# Remote repository replacements
# Replace the domain of game/mod remote repository URLs with mirrors.
# Key is a host (optionally host:port) from the original URL; a key with
# a port matches "host:port" exactly, a key without a port matches the
# hostname regardless of the port.
# Replacement value is "[scheme://]host[:port][/path-prefix]" — parts that
# are not set are kept from the original URL. Query string is preserved.
# Mirrors are tried from the highest priority to the lowest (a plain
# string means priority 0; equal priorities keep the config order).
# The original URL is always tried last, after all replacements failed.
#
# Example: with the rules below and the original URL
#   http://files.gameap.ru/cstrike-1.6/hlcs_base.tar.xz
# the daemon tries
#   1. http://cdn.gameap.com/cstrike-1.6/hlcs_base.tar.xz
#   2. https://mirror.gameap.ru/files/cstrike-1.6/hlcs_base.tar.xz
#   3. http://files.gameap.ru/cstrike-1.6/hlcs_base.tar.xz  (original)
# ------------------------------------------------------------------

# remote_repository_replacements:
#   files.gameap.ru:
#     - replace: cdn.gameap.com
#       priority: 10
#     - replace: https://mirror.gameap.ru/files
#       priority: 9
#
#   # Short forms:
#   files.example.com: cdn.example.com   # single replacement
#   files.example.org:                   # list order = priority
#     - cdn1.example.org
#     - cdn2.example.org

# ------------------------------------------------------------------
# Task manager
# ------------------------------------------------------------------

# task_manager:
#   task_timeout: 2h        # per-task execution timeout

# ------------------------------------------------------------------
# Metrics
# Pull-mode Prometheus-like metrics (cpu, ram, network, disk, ...) are
# exposed to the panel over the gRPC bidi stream. The daemon collects
# samples on a tick and keeps them in an in-memory ring buffer; the
# panel pulls either the latest snapshot or a recent history window.
# ------------------------------------------------------------------

# metrics:
#   enabled: true                  # default: true (set to false to disable)
#   collection_interval: 5s        # default: 5s
#   retention_duration: 10m        # default: 10m, clamped to [10m, 60m]

# ------------------------------------------------------------------
# Process manager
# Choose one backend. Available values:
#   Linux/macOS: tmux (default), systemd, simple, docker, podman
#   Windows:     winsw (default), shawl, simple, docker
# The `config` block provides defaults that are overridden by
# server.Vars / GameMod.Metadata / Game.Metadata (in that order).
# ------------------------------------------------------------------

# --- tmux (Linux/macOS, default) ----------------------------------
# process_manager:
#   name: tmux

# --- systemd (Linux) -----------------------------------------------
# Default scope is "system": units written to /etc/systemd/system,
# requires root (or polkit rules) to manage units. Game servers run
# under the User= / Group= named in their panel record.
# process_manager:
#   name: systemd

# --- systemd, user-mode (Linux) ------------------------------------
# Daemon runs under a regular user; all game servers run under that
# same user — systemctl --user cannot switch identities.
# Requirements:
#   - daemon process owned by a regular (non-root) user
#   - lingering enabled for that user:  sudo loginctl enable-linger <user>
#   - XDG_RUNTIME_DIR available (auto-resolved from /run/user/<uid>)
# Units are written to ~/.config/systemd/user/ and managed via
# `systemctl --user`. If a panel-side server.user differs from the
# daemon's OS user, start/restart/uninstall fail with ErrUserMismatch.
# process_manager:
#   name: systemd
#   config:
#     scope: user

# --- simple (all platforms) ----------------------------------------
# process_manager:
#   name: simple

# --- docker (all platforms) ----------------------------------------
# process_manager:
#   name: docker
#   config:
#     image: debian:bookworm-slim
#     network_mode: bridge
#     dns: 8.8.8.8,1.1.1.1
#     workdir: /server
#     # capabilities: NET_RAW,SYS_NICE
#     # privileged: "false"
#     # memory_limit: 2g
#     # cpu_limit: "1.0"
#     # volumes: '["/shared/maps:/server/maps:ro"]'
#     # installation_image: ghcr.io/parkervcp/installers:alpine
#     # installation_entrypoint: ash
#     # installation_user: root

# --- podman (Linux/macOS) ------------------------------------------
# process_manager:
#   name: podman
#   config:
#     image: debian:bookworm-slim
#     # Rootless default: unix:///run/user/<UID>/podman/podman.sock
#     # Root default:     unix:///run/podman/podman.sock
#     socket_path: unix:///run/user/1000/podman/podman.sock

# --- winsw (Windows) -----------------------------------------------
# process_manager:
#   name: winsw

# --- shawl (Windows) -----------------------------------------------
# process_manager:
#   name: shawl

# ------------------------------------------------------------------
# Windows: users map used by winsw/shawl to start services under a
# local account. Key = OS user, value = password (prefix with
# "base64:" to store the password base64-encoded).
# ------------------------------------------------------------------

# users:
#   gameap: base64:cGFzc3dvcmQ=
#   srcds: MySecretPassword

# If true, Windows services run under "NT AUTHORITY\NETWORK SERVICE"
# and the `users` map is ignored. Default: false.
# use_network_service_user: false
